name: Build Cross-Platform Releases

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-Stable'

jobs:
  compile-and-publish:
    runs-on: self-hosted # Executes natively on your Windows Server
    
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Build Windows Executable Natively
      shell: cmd
      run: |
        call create_executeable.bat ${{ github.ref_name }}

    - name: Build Linux Executable inside Docker Container
      shell: cmd
      run: |
        docker build --build-arg TAG=${{ github.ref_name }} -t ts-obs-linux -f docker .
        :: Create a temporary container container to copy out the built asset
        docker create --name temp_linux ts-obs-linux
        if not exist dist mkdir dist
        docker cp temp_linux:/app/dist/TeamSpeak-OBS-Bridge-App-Linux.tar.gz ./dist/TeamSpeak-OBS-Bridge-App-Linux.tar.gz
        docker rm temp_linux

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        files: |
          dist/TeamSpeak-OBS-Bridge-App-Windows.zip
          dist/TeamSpeak-OBS-Bridge-App-Linux.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
