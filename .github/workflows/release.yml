name: Build Cross-Platform Releases

on:
  push:
    branches:
      - 'beta'
      - 'stable'

jobs:
  compile-and-publish:
    runs-on: self-hosted

    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Retrieve version
        shell: powershell
        run: |
          $version = (Get-Content ./version -Raw).Trim()
          $branch = $env:GITHUB_REF_NAME
          if ($branch) { $branch = $branch.Substring(0,1).ToUpper() + $branch.Substring(1) }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          if ($branch -eq 'beta'){
             $nametext="$version $branch $env:GITHUB_RUN_ID"
          } else {
             $nametext="$version $branch"
          }
          $lines = @(
            "version=$version $branch $env:GITHUB_RUN_ID",
            "name=$nametext",
            "tag=v$version-$branch-$env:GITHUB_RUN_NUMBER"
          )
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, (($lines -join "`n") + "`n"), $utf8NoBom)

      - name: Windows Build check
        shell: cmd
        run: |
          call .\run_tests.bat

      - name: Build Linux Executable
        shell: cmd
        run: |
          docker build --build-arg "TAG=%version%" -t ts-obs-linux -f docker .
          docker create --name temp_linux ts-obs-linux
          if not exist dist mkdir dist
          docker cp temp_linux:/app/dist/TeamSpeak-OBS-Bridge-App-Linux.tar.gz ./dist/TeamSpeak-OBS-Bridge-App-Linux.tar.gz
          docker cp temp_linux:/app/dist/TeamSpeak-OBS-Bridge-App-Linux.tar.gz ./dist/TeamSpeak-OBS-Bridge-App-Headless-Linux.tar.gz
          docker cp temp_linux:/app/dist/readme.pdf ./dist/readme.pdf
          docker cp temp_linux:/app/dist/linux-manifest.json ./dist/linux-manifest.json
          docker rm temp_linux

      - name: Build Windows Executable
        shell: cmd
        run: |
          call .\create_executable.bat "%version%"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          name: Release ${{ env.name }}
          draft: false
          prerelease: ${{ github.ref_name == 'beta' }}
          files: |
            dist/TeamSpeak-OBS-Bridge-App-Windows.zip
            dist/TeamSpeak-OBS-Bridge-App-Headless-Windows.zip
            dist/linux-manifest.json
            dist/TeamSpeak-OBS-Bridge-App-Linux.tar.gz
            dist/TeamSpeak-OBS-Bridge-App-Headless-Linux.tar.gz
            dist/windows-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        shell: cmd
        run: |
          echo "Cleaning up local workspace build files..."
          if exist "dist" rmdir /s /q "dist"
          if exist "venv" rmdir /s /q "venv"
          
          echo "Cleaning up Docker builder cache and dangling images..."
          docker image rm ts-obs-linux --force
          docker system prune -f
