name: Test Cross-Platform Releases

on:
  push:
    branches:
      - 'master'

jobs:
  compile-and-publish:
    runs-on: self-hosted

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Windows Build check
        shell: cmd
        run: |
          call .\run_tests.bat

      - name: Build Linux Executable
        shell: cmd
        run: |
          docker build -t ts-obs-linux -f docker-test .
          docker run --rm ts-obs-linux

      - name: Cleanup
        if: always()
        shell: cmd
        run: |
          echo "Cleaning up local workspace build files..."
          if exist "dist" rmdir /s /q "dist"
          if exist "venv" rmdir /s /q "venv"
          
          echo "Cleaning up Docker builder cache and dangling images..."
          docker image rm ts-obs-linux --force
          docker system prune -f
