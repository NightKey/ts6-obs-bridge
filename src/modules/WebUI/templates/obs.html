<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="voice-widget-theme">

    <div class="container">
        <div class="header">
            <h1>OBS Studio Scenes</h1>
            <div class="header-controls">
                <div class="queue-pill">
                    Queue: <span id="queueCounter" class="queue-count queue-normal">0</span>
                </div>
                <button id="refreshObsBtn" class="btn btn-secondary refresh-btn" title="Reinitialize OBS">
                    &#x21BB;
                </button>
                <div id="live-indicator">Connected</div>
            </div>
        </div>
        <ul class="user-list" id="sceneList">
            <div class="empty-state">Connecting to OBS backend data source...</div>
        </ul>
    </div>

    <script src="/static/obs_updater.js" defer></script>
</body>
</html>
